# Pinned actions and the locked tools move only by a pull request, which every check runs on before its merge
# (tools/ci.sh, while GitHub's CI runs weekly: CONTRIBUTING.md); a new release waits a week first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
