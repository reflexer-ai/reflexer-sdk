name: ci
on:
  schedule:
    - cron: "29 6 * * 1"  # weekly, for its minutes; before a merge every check runs locally: tools/ci.sh
  workflow_dispatch:
  workflow_call:  # the release runs every check again, from this one definition

concurrency:  # a newer push to a pull request stops the run it replaces
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # gitleaks reads every commit
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          version: "0.11.7"
      - name: Tools
        run: uv sync --locked --group dev --group test --group frameworks --group bedrock
      - name: Gates and tests, each gate with its planted fault
        run: uv run --locked python -m unittest discover -s tests -t . -v
      - name: Acceptance, offline over real sockets, TLS and the provider SDKs
        run: uv run --locked python tests/acceptance/run.py
      - name: Acceptance's controls, each a fault planted in the SDK that turns its cases red
        run: uv run --locked python -m unittest tests.acceptance.test_controls -v
      - name: The docs' examples, each run as written against the stand-ins
        run: uv run --locked python -m unittest tests.acceptance.test_docs -v
      - name: Workflows
        run: uv run --locked zizmor --min-severity low .github
      - name: Secrets in any commit
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --exit-code 1 .
          git init -q planted && echo 'made_up = "AKIA''IOSFODNN7EXAMPLA"' > planted/key.py
          git -C planted add key.py && git -C planted -c user.name=ci -c user.email=ci@example.invalid commit -qm planted
          if ./gitleaks git --exit-code 1 planted >/dev/null; then echo "gitleaks missed a key planted in a commit"; exit 1; fi

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # a pull request runs the oldest and newest; main and a release, all
        node: ${{ github.event_name == 'pull_request' && fromJSON('["20", "24"]') || fromJSON('["20", "22", "24"]') }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Tools, as the lockfile pins and hashes them
        run: npm ci --ignore-scripts
      - name: Types, and the declarations a TypeScript client reads
        run: npm run build
      - name: Gates and tests, each with its planted fault
        run: npm test
      - name: The dev tree's known vulnerabilities, and its registry signatures
        if: matrix.node == '24'
        run: |
          npm audit --audit-level=low
          npm audit signatures

  python-versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.10", "3.14"]') || fromJSON('["3.10", "3.11", "3.12", "3.13", "3.14"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          version: "0.11.7"
      - name: The SDK's tests on each Python it supports
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          uv sync --locked --no-default-groups --group test --group frameworks --group bedrock --python "$PYTHON"
          uv run --locked --no-default-groups --group test --group frameworks --group bedrock python -m unittest tests.test_logic tests.test_transport tests.test_promises tests.test_langchain tests.test_pydantic_ai tests.test_bedrock tests.test_litellm
          uv run --locked --no-default-groups --group test --group bedrock python tests/acceptance/run.py
          uv run --locked --no-default-groups --group test --group frameworks --group bedrock python -m unittest tests.acceptance.test_docs

