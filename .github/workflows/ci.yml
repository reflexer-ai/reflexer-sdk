name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release runs every check again, from this one definition

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # gitleaks reads every commit
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          version: "0.11.7"
      - name: Tools
        run: uv sync --locked --group dev --group test
      - name: Gates and tests, each gate with its planted fault
        run: uv run --locked python -m unittest discover -s tests -t . -v
      - name: Acceptance, offline over real sockets, TLS and the provider SDKs
        run: uv run --locked python tests/acceptance/run.py
      - name: Acceptance's controls, each a fault planted in the SDK that turns its cases red
        run: uv run --locked python -m unittest tests.acceptance.test_controls -v
      - name: Workflows
        run: uv run --locked zizmor --min-severity low .github
      - name: Secrets in any commit
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --exit-code 1 .
          git init -q planted && echo 'made_up = "AKIA''IOSFODNN7EXAMPLA"' > planted/key.py
          git -C planted add key.py && git -C planted -c user.name=ci -c user.email=ci@example.invalid commit -qm planted
          if ./gitleaks git --exit-code 1 planted >/dev/null; then echo "gitleaks missed a key planted in a commit"; exit 1; fi

  python-versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          version: "0.11.7"
      - name: The SDK's tests on each Python it supports
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          uv sync --locked --no-default-groups --group test --python "$PYTHON"
          uv run --locked --no-default-groups --group test python -m unittest tests.test_logic tests.test_transport tests.test_promises tests.test_langchain
          uv run --locked --no-default-groups --group test python tests/acceptance/run.py

