name: drift
# The provider SDKs move under the client: each day, the SDK's tests on their newest and their oldest supported releases,
# and a check that no new major has come out untested. A red run opens an issue.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  releases:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        resolution: [highest, lowest-direct]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          version: "0.11.7"
      - name: The SDK's tests on these releases
        env:
          RESOLUTION: ${{ matrix.resolution }}
        run: |
          uv venv drift
          uv pip install --python drift --resolution "$RESOLUTION" --group test -e .
          uv pip list --python drift | grep -E "^(openai|anthropic|google-genai|httpx|httpx2|langchain-openai|langchain-google-genai) "
          drift/bin/python -m unittest tests.test_logic tests.test_transport tests.test_promises tests.test_langchain
          drift/bin/python tests/acceptance/run.py

  majors:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: No major of a provider SDK newer than those tested
        run: python3 tools/majors.py

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        releases: [newest, oldest]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: The TypeScript SDK's tests on these provider SDK releases, and no newer major untested
        env:
          RELEASES: ${{ matrix.releases }}
        run: |  # zizmor: ignore[adhoc-packages] drift installs releases outside the lockfile, on purpose
          npm ci --ignore-scripts
          node tools/tested.js > ../tested.txt  # every provider SDK the source names, or a failure
          while read -r name major floor; do
            versions="$(npm view "$name@$major" version --json | tr -d '[]" ' | tr ',' ' ')"
            pick="$(for v in $versions; do echo "$v"; done | awk 'NF && !/-/' | sort -V | tail -1)"
            if [ "$RELEASES" = oldest ]; then pick="$floor"; fi  # the oldest release tested, below which the SDK throws
            echo "$name@$pick" >> ../picks.txt
            newest="$(npm view "$name" version)"
            if [ "${newest%%.*}" -gt "$major" ]; then echo "untested major: $name $newest"; exit 1; fi
          done < ../tested.txt
          xargs npm install --no-save --ignore-scripts < ../picks.txt  # all at once: each install resets the ones before it
          while read -r spec; do
            installed="$(node -p "require('./node_modules/${spec%@*}/package.json').version")"
            if [ "$installed" != "${spec##*@}" ]; then echo "not installed: $spec, but $installed"; exit 1; fi
            echo "on $spec"
          done < ../picks.txt
          npm test

  report:
    needs: [releases, majors, typescript]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue, once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Drift: the SDK fails on a new provider SDK release"
          if [ -z "$(gh issue list -R "$REPO" --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
            gh issue create -R "$REPO" --title "$title" --body "Run: $RUN"
          fi
