name: release
# A tag `v<version>` on a commit of main ships the Python package, `typescript-v<version>` the TypeScript one: only after
# its audit report is in the tree, every check of ci.yml passes again, and two builds come out byte for byte the same:
# Python's from a fresh checkout, with build dependencies pinned by hash and nothing else installed; npm's each from a
# checkout of its own, with its own install from the lockfile. Published with PyPI's and
# npm's trusted publishing, no stored token; PyPI's attestations and npm's provenance tie the files to this workflow.
on:
  push:
    tags: ["v*", "typescript-v*"]
  workflow_dispatch:  # a rehearsal: every step but the tag's and the publish, on the commit chosen

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository] the same commit's checks, as intended

  build:
    needs: checks
    if: github.event_name != 'push' || startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          version: "0.11.7"
      - name: The tag is the package's version, on a commit of main, and its audit report is here
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v$version" = "$TAG"
          git merge-base --is-ancestor HEAD origin/main
          test -s "audits/$TAG.md"
      - name: Two builds, the same bytes
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv build --build-constraint build-constraints.txt --require-hashes -o ../first
          uv build --build-constraint build-constraints.txt --require-hashes -o dist
          (cd ../first && sha256sum ./*) > ../first.sha256
          (cd dist && sha256sum -c ../../first.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: PyPI trusts this workflow, no token stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  npm-build:
    needs: checks
    if: github.event_name != 'push' || startsWith(github.ref_name, 'typescript-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: first
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: second
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: The tag is the package's version, on a commit of main, and its audit report is here
        if: github.event_name == 'push'
        working-directory: first/typescript
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "typescript-v$(node -p 'require("./package.json").version')" = "$TAG"
          git merge-base --is-ancestor HEAD origin/main
          test -s "../audits/$TAG.md"
      - name: Two builds, each in a checkout of its own with its own install, the same bytes; and a difference planted is seen
        run: |
          for build in first second; do
            (cd "$build/typescript" && npm ci --ignore-scripts && mkdir dist && npm pack --pack-destination dist)
          done
          (cd first/typescript/dist && sha256sum ./*) > first.sha256
          (cd second/typescript/dist && sha256sum -c ../../../first.sha256)
          cp -r second/typescript/dist planted && for archive in planted/*.tgz; do printf x >> "$archive"; done
          if (cd planted && sha256sum -c ../first.sha256 > /dev/null 2>&1); then echo "the comparison missed a planted difference"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: npm
          path: second/typescript/dist/
          if-no-files-found: error

  npm-publish:
    needs: npm-build
    if: github.event_name == 'push' && startsWith(github.ref_name, 'typescript-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write  # trusted publishing: npm trusts this workflow, no token stored; it signs the provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm
          path: dist/
      - name: Publish, with provenance
        run: npm publish dist/reflexer-ai-sdk-*.tgz --provenance --access public
