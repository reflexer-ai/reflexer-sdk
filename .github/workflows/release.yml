name: release
# A tag `v<version>` on a commit of main ships the package: only after its audit report is in the tree, every check of
# ci.yml passes again, and two builds from a fresh checkout, with build dependencies pinned by hash and nothing else
# installed, come out byte for byte the same. Published with PyPI's trusted publishing, no stored token; PyPI's
# attestations tie the files to this workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # a rehearsal: every step but the tag's and the publish, on the commit chosen

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository] the same commit's checks, as intended

  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          version: "0.11.7"
      - name: The tag is the package's version, on a commit of main, and its audit report is here
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v$version" = "$TAG"
          git merge-base --is-ancestor HEAD origin/main
          test -s "audits/$TAG.md"
      - name: Two builds, the same bytes
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv build --build-constraint build-constraints.txt --require-hashes -o ../first
          uv build --build-constraint build-constraints.txt --require-hashes -o dist
          (cd ../first && sha256sum ./*) > ../first.sha256
          (cd dist && sha256sum -c ../../first.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: PyPI trusts this workflow, no token stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
