[project]
name = "reflexer"
version = "0.1.0"
description = "Sends a client's LLM calls through reflexer, on the provider SDK the client already uses."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []  # none, and a gate keeps it so: SECURITY.md

[dependency-groups]
dev = ["ruff", "semgrep", "zizmor"]
test = ["openai>=3,<4", "anthropic>=2,<3", "google-genai>=2,<3", "httpx>=0.28", "httpx2>=2.14",  # the SDKs a client brings
        "cryptography>=44",  # the acceptance suite's certificates, made at run time
        "langchain-openai>=1,<2", "langchain-google-genai>=4,<5",  # for the LangChain lines
        "aiohttp>=3.10"]  # google-genai prefers it for async when installed: reflexer must still be on the way
frameworks = ["pydantic-ai-slim[openai,anthropic,google,bedrock]>=2.54,<3"]  # its own group: its floors of the provider SDKs are above ours
bedrock = ["boto3>=1.43,<2", "aiobotocore>=3.10,<4", "anthropic[bedrock]>=2,<3", "litellm>=1.108,<2",  # Amazon Bedrock's libraries a client brings
           "langchain-aws>=1.9,<2", "strands-agents>=1.63,<2"]  # built on boto3: reflexer's line is the boto3 client they are given

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.uv]
package = false  # `uv sync` and `uv run` leave the SDK uninstalled, read from the checkout: they build nothing with build tools unhashed

[tool.hatch.build.targets.wheel]
packages = ["reflexer"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["S", "TID251", "F"]  # bandit's security rules, banned modules, real errors

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"socket".msg = "the SDK opens no connection of its own: the client's HTTP client does"
"subprocess".msg = "the SDK runs nothing"
"pickle".msg = "the SDK loads no code from data"
"marshal".msg = "the SDK loads no code from data"
"ctypes".msg = "no native code"
"importlib.import_module".msg = "the SDK imports by name, in plain sight"
"builtins.__import__".msg = "the SDK imports by name, in plain sight"
"urllib.request".msg = "the SDK opens no connection of its own"
"http.client".msg = "the SDK opens no connection of its own"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "TID251"]
"tools/**" = ["S"]

[tool.reflexer.budget]  # provisional: grows only in a pull request that says why
lines = 513  # every file but Bedrock's; was 471: the options to reflexer (`reflexer_answer`, `reflexer_store`, `reflexer_pass_through`, `reflexer_timeout_ms`) on every client and function, refused as the client is made when not of their kind, each sent only when it differs from its default; a call's own header of each checked before anything is sent, and passed to reflexer as the namespace's; was 461: the per-call skip read by its value, `Reflexer-Skip: true|false`, any other value raised before anything is sent; was 457: a namespace on the line, `reflexer_namespace`, refused when it cannot go as a header, sent on each call to reflexer unless the call names its own; was 448: an OpenAI-format call to a router with a route of its own at reflexer (OpenRouter, Vercel AI Gateway) takes that route, by host, as data; was 446: a sample not a number from 0 to 1 raises when the client is made; was 436: a private IPv4 address in another notation (`10.1`, `0x0a000001`), read as the system's resolver reads it, goes straight, and importlib.metadata's and os's one name used each imported alone; was 429: Gemini's async close in a later event loop leaves that loop's connections, as stock; was 420: a cancel or a ^C on reflexer's leg, or as its failure is counted, raised on alone, without the frames below it or the errors it came while handling, which hold our request; was 346: Gemini's shared client_args, one client's close cutting no other's call, on every path of a call; was 340: LangChain's configurable_fields; was 320: LangChain's two lines; was 300: an audit's fixes, the SDK's own copies and gemini's two HTTP libraries
ifs = 62  # was 55: the options' checks, each sent only when it differs from its default, and a call's own header of each checked; was 52: the per-call skip read by its value, `Reflexer-Skip: true|false`, any other value raised before anything is sent; was 50: the namespace's check and its default; was 49: the router route; was 48: the sample's check; was 46: a private IPv4 address in another notation; was 45: Gemini's close in a later loop; was 37: Gemini's shared client_args; was 35: LangChain's configurable_fields
private_names = 0  # in every file, but those each Bedrock line names below

[tool.reflexer.budget.bedrock]  # Bedrock's files, apart from every other file's: an audit of another provider's path reads none of them
files = ["bedrock.py", "boto3.py", "aiobotocore.py", "anthropic_bedrock.py", "litellm.py"]
private_names = 0  # but those allowed below
lines = 495  # was 478: the options on the Bedrock lines, and a call's own header of each, checked and taken off before the call is signed, for reflexer's leg only, on the botocore lines and anthropic's middleware; was 474: the botocore lines' skip, a header held twice read by its values together, the argument anything but a boolean raised; was 469: the per-call skip read by its value, `Reflexer-Skip: true|false`, any other value raised before anything is sent, on the botocore lines and anthropic's middleware; was 465: the botocore lines' cancel or ^C raised on alone, as the shared transport's (`alone`); was 300: a signed call through reflexer, its fallback signed anew (the botocore family's signer, anthropic's middleware) or, on LiteLLM, its leg bounded by the signature's window
ifs = 78  # was 76: the same as the lines'; was 74: the same as the lines'; was 42: the same

[tool.reflexer.budget.private_names_allowed]  # no public name reaches the client's own HTTP session, which reflexer's leg goes by; each read once, as the line is made, so a release renaming one fails the line, never a call
"boto3.py" = ["_endpoint"]  # botocore's endpoint, whose HTTP session sends the client's calls
"aiobotocore.py" = ["_endpoint", "_get_session", "_proxy_config", "get_referents"]  # and the aiohttp session and proxies it sends them by; gc's get_referents, the one way to the request headers aiohttp keeps with an answer, our key among them
