rules:
  - id: log-only-kinds
    message: The SDK logs what kind of thing happened, never a request's or an answer's content, nor the key.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $LOG.$METHOD(...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(debug|info|warning|warn|error|exception|critical|fatal|log)$
              - metavariable-regex:
                  metavariable: $LOG
                  regex: (?i)log
          - pattern: print(...)
          - pattern: sys.stderr.write(...)
          - pattern: sys.stdout.write(...)
      - pattern-not: $LOG.$KIND("...")
      - pattern-not: $LOG.$KIND("...", type(failure).__name__)  # a name, so nothing runs inside the exempt form
  - id: no-traceback-in-a-log
    message: A logged traceback carries the values of the code it went through.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    patterns:
      - pattern-either:
          - pattern: $LOG.exception(...)
          - pattern: $LOG.$METHOD(..., exc_info=$X, ...)
          - pattern: $LOG.$METHOD(..., stack_info=$X, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)log
  - id: log-only-by-its-logger
    message: >-
      The SDK logs only by its own logger, `log`, made by `log = logging.getLogger("...")`, and only in the forms
      `log-only-kinds` lets through. Any other way to a logger, a handler or a record (an alias, `getattr`, `makeRecord`
      and `handle`, the logging module's own functions, another's logger) is a finding. A builtin that prints or writes (`print`, `open`) is refused by tests/test_gates.py `builtins_not_allowed`.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    patterns:
      - pattern-either:
          - pattern: log
          - pattern: logging
          - pattern: logging.$ANY
          - patterns:
              - pattern: $OBJECT.$NAME
              - metavariable-regex:
                  metavariable: $NAME
                  regex: (?i)^_*(\w+_)?(log|logger|logging)$
      - pattern-not-inside: log = logging.getLogger("...")
      - pattern-not-inside: log.debug("...")
      - pattern-not-inside: log.debug("...", type(failure).__name__)
      - pattern-not-inside: log.info("...")
      - pattern-not-inside: log.info("...", type(failure).__name__)
      - pattern-not-inside: log.warning("...")
      - pattern-not-inside: log.warning("...", type(failure).__name__)
      - pattern-not-inside: log.error("...")
      - pattern-not-inside: log.error("...", type(failure).__name__)
      - pattern-not-inside: log.critical("...")
      - pattern-not-inside: log.critical("...", type(failure).__name__)
  - id: no-namespace-by-name
    message: >-
      A module or a builtin reached through a namespace read by name escapes the import allowlist: `vars`, `globals`,
      `locals`, `__builtins__`, `getattr` but with a name written in place, not a namespace's, a module's or a function's
      namespace (`__dict__`, `__globals__`, `__self__`, ...), a frame's but its `__name__`, `inspect` but its `signature`
      and `iscoroutinefunction`.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    patterns:
      - pattern-either:
          - pattern: vars
          - pattern: globals
          - pattern: locals
          - pattern: __builtins__
          - patterns:  # a name not written in place, or arguments unpacked
              - pattern: getattr(...)
              - pattern-not: getattr($OBJECT, "...")
              - pattern-not: getattr($OBJECT, "...", $DEFAULT)
          - patterns:  # handed on, to be called where no rule sees it
              - pattern: getattr
              - pattern-not-inside: getattr(...)
          - patterns:
              - pattern: getattr($OBJECT, "$NAME", ...)
              - metavariable-regex:
                  metavariable: $NAME
                  regex: ^(__dict__|__globals__|__builtins__|__self__|__subclasses__|__getattribute__|__loader__|__spec__|__import__|__code__|__closure__|__doc__|f_globals|f_locals|f_builtins)$
          - patterns:  # of inspect, only what reads a function's form: its others reach modules, frames, closures
              - pattern: inspect.$FUNCTION
              - metavariable-regex:
                  metavariable: $FUNCTION
                  regex: ^(?!(signature|iscoroutinefunction)$)
          - patterns:
              - pattern: $OBJECT.$NAME
              - metavariable-regex:
                  metavariable: $NAME
                  regex: ^(__dict__|__globals__|__builtins__|__self__|__subclasses__|__getattribute__|__loader__|__spec__|__import__|__code__|__closure__|__doc__|f_globals|f_locals|f_builtins)$
      - pattern-not-inside: frame.tb_frame.f_globals.get("__name__")  # names, so nothing runs inside the exempt form
  - id: no-dynamic-code
    message: The SDK imports by name and runs no code built at run time.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    pattern-either:
      - pattern: __import__(...)
      - pattern: importlib.import_module(...)
      - pattern: importlib.__import__(...)
      - pattern: entry_points(...)
      - pattern: importlib.metadata.entry_points(...)
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: compile(...)
      - pattern: getattr(__builtins__, ...)
  - id: no-module-through-another
    message: A module reached as another's attribute escapes the import allowlist.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    patterns:
      - pattern: $OBJECT.$NAME
      - metavariable-regex:
          metavariable: $NAME
          regex: ^(sys|os|subprocess|socket|ssl|builtins|importlib|ctypes|handlers|request|client|shutil|signal|threading)$
      - pattern-not: threading.$NAME
      - pattern-not: boto3.client  # boto3's own function making a client, not http's module

  - id: log-only-kinds-js
    message: The SDK logs what kind of thing happened, never a request's or an answer's content, nor the key.
    languages: [javascript]
    severity: ERROR
    paths: {include: ["/typescript/src/"]}
    patterns:
      - pattern-either:
          - pattern: console
          - pattern: process.$STREAM.write(...)
      - pattern-not-inside: console.warn("...")
      - pattern-not-inside: 'console.warn("...", failure instanceof Error ? failure.name : typeof failure)'  # a name, so nothing runs inside
  - id: key-header-only-in-route-js
    message: >-
      Only `Reflexer.route` names the key's header, so the key reaches only reflexer's address. Built from parts too:
      any text that holds `k`, `ke` or `key` apart from other letters, or a `k` escaped, is a finding outside it and an
      error's message, however it is joined (`+`, `concat`, a template, `join`); so is an object's quoted key holding
      `-key` or `_key`. Python's: tests/test_gates.py `key_header_named`.
    languages: [javascript]
    severity: ERROR
    paths: {include: ["/typescript/src/"]}
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: '"$TEXT"'
                  - pattern: '`...$TEXT...`'
                  - pattern: /$TEXT/
              - metavariable-regex:
                  metavariable: $TEXT
                  regex: (?is)^.*?(?:(?<![a-z])(?:k|\x{212A})(?:ey?)?(?![a-z])|\\(?:x[46]b|u00[46]b|u212a|u\{0*(?:[46]b|212a)\}))
          - patterns:  # a key not quoted (`{ key }`) is a name, never the header's
              - pattern: '{..., "$TEXT": $VALUE, ...}'
              - metavariable-regex:
                  metavariable: $TEXT
                  regex: (?is)^.*?(?:[-_]k(?:ey?)?(?![a-z])|\\(?:x[46]b|u00[46]b|u\{0*[46]b\}))
      - pattern-not-inside: throw new $ERROR("...")  # an error's message, to the client
      - pattern-not-inside: throw new $ERROR(`...${base}`)  # checkedBase's, which names the address refused
      - pattern-not-inside: |
          class Reflexer {
            ...
            route(...) {
              ...
            }
            ...
          }
