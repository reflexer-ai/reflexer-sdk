rules:
  - id: log-only-kinds
    message: The SDK logs what kind of thing happened, never a request's or an answer's content, nor the key.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $LOG.$METHOD(...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(debug|info|warning|warn|error|exception|critical|fatal|log)$
              - metavariable-regex:
                  metavariable: $LOG
                  regex: (?i)log
          - pattern: print(...)
          - pattern: sys.stderr.write(...)
          - pattern: sys.stdout.write(...)
      - pattern-not: $LOG.$KIND("...")
      - pattern-not: $LOG.$KIND("...", type($X).__name__)
  - id: no-traceback-in-a-log
    message: A logged traceback carries the values of the code it went through.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    patterns:
      - pattern-either:
          - pattern: $LOG.exception(...)
          - pattern: $LOG.$METHOD(..., exc_info=$X, ...)
          - pattern: $LOG.$METHOD(..., stack_info=$X, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)log
  - id: key-header-only-in-route
    message: >-
      Only `Reflexer.route` names the key's header, so the key reaches only reflexer's address. Built from parts too:
      any text with no space that holds `k`, `ke` or `key` apart from other letters (`"key"`, `"-Key"`, `"{}key"`,
      `"reflexer-k"`) is a finding outside it, however it is joined (`+`, `%`, `format`, f-strings, `join`).
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    patterns:
      - pattern-either:
          - pattern: '"$TEXT"'
          - pattern: f"...$TEXT..."
      - metavariable-regex:
          metavariable: $TEXT
          regex: (?i)^\S*(?<![a-z])k(?:ey?)?(?![a-z])\S*$
      - pattern-not-inside: |
          class Reflexer:
              ...
              def route(...):
                  ...
  - id: log-only-by-its-logger
    message: >-
      The SDK logs only by its own logger, `log`, made by `log = logging.getLogger("...")`, and only in the forms
      `log-only-kinds` lets through. Any other way to a logger, a handler or a record (an alias, `getattr`, `makeRecord`
      and `handle`, the logging module's own functions, another's logger) is a finding, as is `print` or `open` reached at all.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    patterns:
      - pattern-either:
          - pattern: log
          - pattern: logging
          - pattern: logging.$ANY
          - pattern: print
          - pattern: open
          - patterns:
              - pattern: $OBJECT.$NAME
              - metavariable-regex:
                  metavariable: $NAME
                  regex: (?i)^_*(\w+_)?(log|logger|logging)$
      - pattern-not-inside: log = logging.getLogger("...")
      - pattern-not-inside: log.debug("...")
      - pattern-not-inside: log.debug("...", type($X).__name__)
      - pattern-not-inside: log.info("...")
      - pattern-not-inside: log.info("...", type($X).__name__)
      - pattern-not-inside: log.warning("...")
      - pattern-not-inside: log.warning("...", type($X).__name__)
      - pattern-not-inside: log.error("...")
      - pattern-not-inside: log.error("...", type($X).__name__)
      - pattern-not-inside: log.critical("...")
      - pattern-not-inside: log.critical("...", type($X).__name__)
  - id: no-namespace-by-name
    message: >-
      A module or a builtin reached through a namespace read by name escapes the import allowlist: `vars`, `globals`,
      `locals`, `__builtins__`, `getattr` with a name not written in place, a module's or a function's namespace
      (`__dict__`, `__globals__`, `__self__`, ...), a frame's but its `__name__`, `inspect`'s ways to a module or a frame.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    patterns:
      - pattern-either:
          - pattern: vars
          - pattern: globals
          - pattern: locals
          - pattern: __builtins__
          - pattern: getattr($OBJECT, $NAME, ...)
          - pattern: inspect.getmodule
          - pattern: inspect.getmembers
          - pattern: inspect.currentframe
          - pattern: inspect.stack
          - pattern: inspect.trace
          - patterns:
              - pattern: $OBJECT.$NAME
              - metavariable-regex:
                  metavariable: $NAME
                  regex: ^(__dict__|__globals__|__builtins__|__self__|__subclasses__|__getattribute__|__loader__|__spec__|__import__|__code__|__closure__|f_globals|f_locals|f_builtins)$
      - pattern-not: getattr($OBJECT, "...", ...)
      - pattern-not-inside: $FRAME.f_globals.get("__name__")
  - id: no-dynamic-code
    message: The SDK imports by name and runs no code built at run time.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    pattern-either:
      - pattern: __import__(...)
      - pattern: importlib.import_module(...)
      - pattern: importlib.__import__(...)
      - pattern: entry_points(...)
      - pattern: importlib.metadata.entry_points(...)
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: compile(...)
      - pattern: getattr(__builtins__, ...)
  - id: no-module-through-another
    message: A module reached as another's attribute escapes the import allowlist.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    patterns:
      - pattern: $OBJECT.$NAME
      - metavariable-regex:
          metavariable: $NAME
          regex: ^(sys|os|subprocess|socket|ssl|builtins|importlib|ctypes|handlers|request|client|shutil|signal|threading)$
      - pattern-not: threading.$NAME
      - pattern-not: boto3.client  # boto3's own function making a client, not http's module

  - id: log-only-kinds-js
    message: The SDK logs what kind of thing happened, never a request's or an answer's content, nor the key.
    languages: [javascript]
    severity: ERROR
    paths: {include: ["/typescript/src/"]}
    patterns:
      - pattern-either:
          - pattern: console
          - pattern: process.$STREAM.write(...)
      - pattern-not-inside: console.warn("...")
      - pattern-not-inside: 'console.warn("...", $FAILURE instanceof Error ? $FAILURE.name : typeof $FAILURE)'
  - id: key-header-only-in-route-js
    message: >-
      Only `Reflexer.route` names the key's header, so the key reaches only reflexer's address. Built from parts too:
      any text with no space that holds `k`, `ke` or `key` apart from other letters is a finding outside it, however it
      is joined (`+`, `concat`, a template, `join`); so is an object's quoted key holding `-key` or `_key`.
    languages: [javascript]
    severity: ERROR
    paths: {include: ["/typescript/src/"]}
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: '"$TEXT"'
                  - pattern: '`...$TEXT...`'
              - metavariable-regex:
                  metavariable: $TEXT
                  regex: (?i)^\S*(?<![a-z])k(?:ey?)?(?![a-z])\S*$
          - patterns:  # a key not quoted (`{ key }`) is a name, never the header's
              - pattern: '{..., "$TEXT": $VALUE, ...}'
              - metavariable-regex:
                  metavariable: $TEXT
                  regex: (?i)^\S*[-_]k(?:ey?)?(?![a-z])\S*$
      - pattern-not-inside: |
          class Reflexer {
            ...
            route(...) {
              ...
            }
            ...
          }
