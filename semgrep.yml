rules:
  - id: log-only-kinds
    message: The SDK logs what kind of thing happened, never a request's or an answer's content, nor the key.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $LOG.$METHOD(...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(debug|info|warning|warn|error|exception|critical|fatal|log)$
              - metavariable-regex:
                  metavariable: $LOG
                  regex: (?i)log
          - pattern: print(...)
          - pattern: sys.stderr.write(...)
          - pattern: sys.stdout.write(...)
      - pattern-not: $LOG.$KIND("...")
      - pattern-not: $LOG.$KIND("...", type($X).__name__)
  - id: no-traceback-in-a-log
    message: A logged traceback carries the values of the code it went through.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    patterns:
      - pattern-either:
          - pattern: $LOG.exception(...)
          - pattern: $LOG.$METHOD(..., exc_info=$X, ...)
          - pattern: $LOG.$METHOD(..., stack_info=$X, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)log
  - id: key-header-only-in-route
    message: Only `Reflexer.route` names the key's header, so the key reaches only reflexer's address.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    patterns:
      - pattern-either:
          - patterns:
              - pattern: '"$NAME"'
              - metavariable-regex:
                  metavariable: $NAME
                  regex: (?i)^reflexer[-_]key$
          - patterns:
              - pattern-either:
                  - pattern: $PREFIX + "$PART"
                  - pattern: f"{$PREFIX}$PART"
              - metavariable-regex:
                  metavariable: $PART
                  regex: (?i)^key$
          - patterns:
              - pattern-either:
                  - pattern: $TEXT.format(...)
                  - pattern: $TEXT % $ARGUMENTS
              - metavariable-regex:
                  metavariable: $TEXT
                  regex: (?i)^["'].*key.*["']$
      - pattern-not-inside: |
          class Reflexer:
              ...
              def route(...):
                  ...
  - id: no-dynamic-code
    message: The SDK imports by name and runs no code built at run time.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    pattern-either:
      - pattern: __import__(...)
      - pattern: importlib.import_module(...)
      - pattern: importlib.__import__(...)
      - pattern: entry_points(...)
      - pattern: importlib.metadata.entry_points(...)
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: compile(...)
      - pattern: getattr(__builtins__, ...)
  - id: no-module-through-another
    message: A module reached as another's attribute escapes the import allowlist.
    languages: [python]
    severity: ERROR
    paths: {include: ["reflexer/"]}
    patterns:
      - pattern: $OBJECT.$NAME
      - metavariable-regex:
          metavariable: $NAME
          regex: ^(sys|os|subprocess|socket|ssl|builtins|importlib|ctypes|handlers|request|client|shutil|signal|threading)$
      - pattern-not: threading.$NAME

  - id: log-only-kinds-js
    message: The SDK logs what kind of thing happened, never a request's or an answer's content, nor the key.
    languages: [javascript]
    severity: ERROR
    paths: {include: ["/typescript/src/"]}
    patterns:
      - pattern-either:
          - pattern: console
          - pattern: process.$STREAM.write(...)
      - pattern-not-inside: console.warn("...")
      - pattern-not-inside: 'console.warn("...", $FAILURE instanceof Error ? $FAILURE.name : typeof $FAILURE)'
  - id: key-header-only-in-route-js
    message: Only `Reflexer.route` names the key's header, so the key reaches only reflexer's address.
    languages: [javascript]
    severity: ERROR
    paths: {include: ["/typescript/src/"]}
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: '"$NAME"'
                  - pattern: '{..., "$NAME": $VALUE, ...}'
              - metavariable-regex:
                  metavariable: $NAME
                  regex: (?i)^reflexer[-_]key$
          - patterns:
              - pattern-either:
                  - pattern: $PREFIX + "$PART"
                  - pattern: '`${$PREFIX}$PART`'
                  - pattern: $PREFIX.concat("$PART")
                  - pattern: '[..., "$PART"].join(...)'
              - metavariable-regex:
                  metavariable: $PART
                  regex: (?i)^key$
      - pattern-not-inside: |
          class Reflexer {
            ...
            route(...) {
              ...
            }
            ...
          }
